<dialog id="trainingCaptchaDialog" aria-labelledby="trainingCaptchaTitle" aria-describedby="trainingCaptchaMessage">
  <h2 id="trainingCaptchaTitle">Confirma para iniciar el respaldo</h2>
  <p>Esta comprobación protege el guardado sin cuenta. Tus flechas siguen guardadas en este dispositivo.</p>
  <p id="trainingCaptchaMessage" role="status" aria-live="polite">Cargando verificación…</p>
  <div id="trainingCaptchaWidget"></div>
  <button id="trainingCaptchaRetry" type="button" hidden>Reintentar verificación</button>
  <form method="dialog"><button type="submit">Volver</button></form>
</dialog>
